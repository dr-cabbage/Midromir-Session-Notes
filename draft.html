<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session draft — for review</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%8F%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4efe4; --panel: #fbf8f1; --panel-2: #efe8d8; --line: #dcd2bc;
  --ink: #221c2b; --ink-2: #4f4659; --ink-3: #857b8c;
  --accent: #2f6f73; --ember: #b4532a; --ember-soft: #f3dccf; --gold: #9a7417;
  --good: #3d7a4a; --bad: #a23b3b; --warn-soft: #f6ecd0;
  --shadow: 0 1px 2px rgb(40 30 20 / .06), 0 4px 16px rgb(40 30 20 / .05);
  --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans: "Source Sans 3", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15131b; --panel: #1d1a25; --panel-2: #25212f; --line: #342f40;
    --ink: #ece6f2; --ink-2: #b9b0c4; --ink-3: #7f7690;
    --accent: #6cc0bf; --ember: #e58a5c; --ember-soft: #3d2519; --gold: #d9b456;
    --good: #7cc48a; --bad: #e77f7f; --warn-soft: #3a3220;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15131b; --panel: #1d1a25; --panel-2: #25212f; --line: #342f40;
  --ink: #ece6f2; --ink-2: #b9b0c4; --ink-3: #7f7690;
  --accent: #6cc0bf; --ember: #e58a5c; --ember-soft: #3d2519; --gold: #d9b456;
  --good: #7cc48a; --bad: #e77f7f; --warn-soft: #3a3220;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.65 var(--sans); }
a { color: var(--accent); }
.wrap { max-width: 780px; margin: 0 auto; padding: 0 16px; }

.banner { background: var(--ember); color: #fff; }
.banner .wrap { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding-top: 9px; padding-bottom: 9px; font-size: 15px; }
.banner b { letter-spacing: .04em; }
.banner .grow { flex: 1; }
.btn { border: 1px solid rgb(255 255 255 / .55); background: transparent; color: #fff; border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn:hover { background: rgb(255 255 255 / .15); }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }

header.hero { padding: 34px 0 20px; border-bottom: 1px solid var(--line); }
.snum { color: var(--ember); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 13px; }
h1 { font: 700 clamp(30px, 5.6vw, 46px)/1.08 var(--serif); margin: 6px 0 10px; }
.teaser { font-size: 19px; color: var(--ink-2); margin: 0; }
.when { color: var(--ink-3); font-size: 14px; margin-top: 10px; }

main { padding: 24px 0 40px; }
.recap p { margin: 0 0 16px; }
h2 { font: 600 13px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 32px 0 10px; }
ul.plain { margin: 0; padding-left: 22px; }
ul.plain li { margin: 6px 0; }
.cliff { border-left: 3px solid var(--ember); padding: 12px 16px; background: var(--panel-2); border-radius: 0 10px 10px 0; font-style: italic; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 13px 16px; box-shadow: var(--shadow); margin-bottom: 10px; }
.card h3 { font: 600 20px/1.2 var(--serif); margin: 0 0 2px; }
.card .role { color: var(--ink-3); font-size: 14px; margin-bottom: 6px; }
.card p { margin: 0; }
.ask { background: var(--warn-soft); border-color: color-mix(in srgb, var(--gold) 45%, transparent); }
.pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--panel-2); color: var(--ink-2); text-transform: capitalize; margin-left: 6px; }
blockquote { margin: 0 0 4px; font: 500 20px/1.35 var(--serif); }
blockquote::before { content: "\201C"; color: var(--ember); }
blockquote::after { content: "\201D"; color: var(--ember); }
.qby { color: var(--ink-3); font-size: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.note { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 24px 0; color: var(--ink-2); font-size: 15px; }
.empty { padding: 40px 20px; text-align: center; color: var(--ink-3); border: 1px dashed var(--line); border-radius: 14px; margin-top: 30px; }
footer { color: var(--ink-3); font-size: 14px; padding-bottom: 40px; }
#flash {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 9px 16px; border-radius: 10px; font-size: 15px; display: none; box-shadow: 0 6px 24px rgb(0 0 0 / .25);
}
@media print { .banner, #flash { display: none; } }
</style>
</head>
<body>
<div class="banner"><div class="wrap">
  <b>DRAFT — not published yet</b>
  <span class="grow"></span>
  <span class="live"><span class="dot"></span><span id="livetext">updates automatically</span></span>
  <button class="btn" id="refresh">Refresh now</button>
</div></div>
<header class="hero"><div class="wrap">
  <div class="snum" id="snum">Session</div>
  <h1 id="title">Loading the draft…</h1>
  <p class="teaser" id="teaser"></p>
  <div class="when" id="when"></div>
</div></header>
<main class="wrap" id="main"></main>
<footer class="wrap" id="foot"></footer>
<div id="flash" role="status"></div>

<script>
(() => {
  "use strict";
  const params = new URLSearchParams(location.search);
  const n = Number(params.get("s") || location.hash.replace("#", "") || 1);
  const pad = String(n).padStart(2, "0");
  const DRAFT_URL = params.get("draft") || `drafts/session-${pad}.json`;
  const META_URL = params.get("meta") || `drafts/session-${pad}.meta.json`;

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pill = v => v ? `<span class="pill">${esc(v)}</span>` : "";
  const sect = (label, arr) => arr && arr.length
    ? `<h2>${label}</h2><ul class="plain">${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  const card = (title, role, body, cls = "") => `<article class="card ${cls}"><h3>${esc(title)}</h3>
    ${role ? `<div class="role">${role}</div>` : ""}${body ? `<p>${esc(body)}</p>` : ""}</article>`;
  const flash = msg => {
    const f = $("flash"); f.textContent = msg; f.style.display = "block";
    clearTimeout(flash._t); flash._t = setTimeout(() => (f.style.display = "none"), 4000);
  };
  const ago = iso => {
    const d = new Date(iso);
    if (isNaN(d)) return "";
    const mins = Math.round((Date.now() - d) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return `${mins} min ago`;
    return d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
  };

  let last = null;

  async function load(manual) {
    try {
      const bust = `?t=${Date.now()}`;
      const [draft, meta, campaign] = await Promise.all([
        fetch(DRAFT_URL + bust, { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
        fetch(META_URL + bust, { cache: "no-store" }).then(r => r.ok ? r.json() : {}).catch(() => ({})),
        fetch("data/campaign.json" + bust, { cache: "no-store" }).then(r => r.ok ? r.json() : {}).catch(() => ({})),
      ]);
      const published = (campaign.sessions || []).some(x => x.number === n);
      const text = JSON.stringify(draft);
      const changed = last !== null && last !== text;
      last = text;
      render(draft, meta, changed, published);
      if (changed) flash("The draft just changed — this is the latest version.");
      else if (manual) flash("You're up to date.");
      $("livetext").textContent = "updates automatically";
    } catch (err) {
      $("livetext").textContent = "couldn't refresh";
      if (last === null) {
        $("title").textContent = "No draft to review yet";
        $("main").innerHTML = `<div class="empty">There's no draft for session ${n} on the site yet
          (couldn't read <code>${esc(DRAFT_URL)}</code>).<br>Ask whoever runs the Scribe to share it.</div>`;
      }
    }
  }

  function render(draft, meta, changed, published) {
    const s = draft.session || {};
    document.title = `DRAFT — Session ${n}: ${s.title || ""}`;
    $("snum").textContent = `Draft · Session ${n}`;
    $("title").textContent = s.title || `Session ${n}`;
    $("teaser").textContent = s.summary || "";
    $("when").textContent = meta.shared_at ? `Last updated ${ago(meta.shared_at)}` : "";

    const list = (k) => Array.isArray(draft[k]) ? draft[k] : [];
    const banner = document.querySelector(".banner");
    banner.style.background = published ? "var(--good)" : "";
    banner.querySelector("b").textContent = published ? "PUBLISHED — this version is in the chronicle" : "DRAFT — not published yet";
    $("main").innerHTML = `
      ${published ? `<div class="note" style="border-color:var(--good)">This session is now part of the chronicle:
        <a href="session.html?s=${n}">read the published version</a>. Anything below is the draft it came from.</div>` : ""}
      <div class="note">These notes aren't final. Read them over and say anything that's wrong, missing or
      not actually what happened — whoever is running the Scribe can fix it and update this page while you talk.
      Hit <b>Refresh now</b> to see their latest version.</div>

      <div class="recap">${(s.recap || []).map(p => `<p>${esc(p)}</p>`).join("")}</div>
      ${s.cliffhanger ? `<h2>Where we left off</h2><div class="cliff">${esc(s.cliffhanger)}</div>` : ""}
      ${(s.uncertain || []).length ? `<h2>Questions for the table</h2>` +
        (s.uncertain || []).map(q => card(q, "", "", "ask")).join("") : ""}
      ${sect("Highlights", s.highlights)}
      ${sect("Big decisions", s.decisions)}
      ${list("party_updates").length ? `<h2>The party</h2>` + list("party_updates").map(p =>
        card(p.name, [p.level && `level ${p.level}`, p.status].filter(Boolean).join(" · "), p.note)).join("") : ""}
      ${list("npcs").length ? `<h2>Who they met</h2>` + list("npcs").map(x =>
        card(x.name, [x.role, x.location].filter(Boolean).join(" · ") + pill(x.disposition) + (x.status && x.status !== "alive" ? pill(x.status) : ""),
          [x.description, x.note].filter(Boolean).join(" — "))).join("") : ""}
      ${list("locations").length ? `<h2>Where they went</h2>` + list("locations").map(x =>
        card(x.name, esc(x.description || ""), x.note)).join("") : ""}
      ${list("quests").length ? `<h2>Quests</h2>` + list("quests").map(q =>
        card(q.title, pill(q.action) + (q.giver ? ` from ${esc(q.giver)}` : ""), [q.description, q.note].filter(Boolean).join(" — "))).join("") : ""}
      ${list("mysteries").length ? `<h2>Mysteries</h2>` + list("mysteries").map(m =>
        card(m.title, pill(m.action), [m.description, m.clue, m.resolution].filter(Boolean).join(" — "))).join("") : ""}
      ${list("loot").length ? `<h2>Loot</h2><table><thead><tr><th>Item</th><th>Who has it</th><th>Notes</th></tr></thead><tbody>` +
        list("loot").map(l => `<tr><td><b>${esc(l.item)}</b></td><td>${esc(l.holder || "")}</td><td>${esc(l.description || "")}</td></tr>`).join("") + `</tbody></table>` : ""}
      ${list("kills").length ? `<h2>Kill tally</h2><ul class="plain">` +
        list("kills").map(k => `<li>${esc(k.character)}: ${esc(k.count)}× ${esc(k.creature)}</li>`).join("") + `</ul>` : ""}
      ${list("quotes").length ? `<h2>Quotes of the night</h2>` + list("quotes").map(q =>
        `<figure class="card" style="margin:0 0 10px"><blockquote>${esc(q.text)}</blockquote><figcaption class="qby">— ${esc(q.speaker)}</figcaption></figure>`).join("") : ""}
      ${sect("Table talk (not canon)", s.table_talk)}
    `;
    $("foot").innerHTML = `Draft of session ${n}. Once it's agreed, it joins the chronicle at <a href="index.html">the full campaign site</a>.`;
    if (changed) window.scrollTo({ top: Math.min(window.scrollY, 200), behavior: "smooth" });
  }

  $("refresh").onclick = () => load(true);
  load(false);
  setInterval(() => { if (!document.hidden) load(false); }, 25000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(false); });
})();
</script>
</body>
</html>
